    </circle>
    <text x="44" y="246" fill="#64748b" font-size="10" letter-spacing="1">PUBLIC 42 PROFILE DATA</text>
    <text x="856" y="246" fill="#64748b" font-size="10" text-anchor="end" letter-spacing="1">GENERATED FOR GITHUB</text>
